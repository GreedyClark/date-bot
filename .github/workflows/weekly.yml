name: Нагадування в четвер

on:
  schedule:
    - cron: "0 16 * * 4"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Будимо сервер
        run: curl -s --max-time 120 --retry 3 --retry-delay 20 "${{ secrets.PUBLIC_URL }}/health/"
      - name: Надсилаємо ідеї
        run: |
          curl -sf --max-time 120 --retry 2 --retry-delay 20 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PUBLIC_URL }}/cron/weekly/"
